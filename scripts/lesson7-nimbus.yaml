AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys a public EC2 instance that installs the finance app, creates a Python
  virtual environment, and runs Streamlit on port 8501.

Parameters:
  GitHubRepoUrl:
    Type: String
    Default: https://github.com/your-user/your-repo.git
    Description: Git repository URL for this app.

Resources:
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: app-vpc

  AppInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: app-igw

  AppVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AppVpc
      InternetGatewayId: !Ref AppInternetGateway

  AppPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: app-public-subnet

  AppPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc
      Tags:
        - Key: Name
          Value: app-public-route-table

  AppPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AppVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref AppPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref AppInternetGateway

  AppSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppPublicSubnet
      RouteTableId: !Ref AppPublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: AppSecurityGroup
      GroupDescription: Allow SSH and Streamlit traffic
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Streamlit app
      Tags:
        - Key: Name
          Value: app-security-group

  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0fef201115eefe936
      InstanceType: t2.micro
      KeyName: vockey
      SubnetId: !Ref AppPublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: finance-streamlit-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe

          yum update -y
          yum install -y git python3 python3-pip

          APP_DIR=/home/ec2-user/smu-cce-starter
          if [ ! -d "$APP_DIR" ]; then
            git clone ${GitHubRepoUrl} "$APP_DIR"
          fi

          cd "$APP_DIR"

          python3 -m ensurepip --upgrade
          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

          mkdir -p /home/ec2-user/.streamlit
          cat > /home/ec2-user/.streamlit/config.toml <<'EOF'
          [server]
          headless = true
          address = "0.0.0.0"
          port = 8501
          enableCORS = false
          EOF

          nohup python -m streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501 > /tmp/streamlit.log 2>&1 &

          echo "Streamlit app is starting on port 8501" > /tmp/streamlit-status.txt

Outputs:
  PublicIp:
    Description: Public IP of the EC2 instance
    Value: !GetAtt AppServer.PublicIp

  StreamlitUrl:
    Description: URL for the Streamlit app
    Value: !Sub http://${AppServer.PublicIp}:8501